[project]
name = "qna-bot"
version = "0.1.0"
description = "Production-grade multimodal AI Q&A chatbot powered by Streamlit, LangChain, and Groq."
readme = "README.md"
authors = [
    { name = "alindapal07", email = "151637518+alindapal07@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "docx2txt>=0.9",
    "dotenv>=0.9.9",
    "duckduckgo-search>=8.1.1",
    "faiss-cpu>=1.15.1",
    "groq>=0.37.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "notebook>=7.6.3",
    "pillow>=12.3.0",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.65.0",
]

[project.scripts]
qna-bot = "qna_bot.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qna_bot"
module-root = ""
